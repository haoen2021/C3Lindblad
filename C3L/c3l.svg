  <title id="title">C3L — coupled-cluster coupled Lindblad</title>
  <desc id="desc">Three C letters on a teal, cream, and gold cube, beside a calligraphic L that flows into a two-peak spectrum. Reconstructed as editable vector paths from the supplied logo; the spectrum is illustrative, not numerical data. Transparent background.</desc>
